name: Build Eye Control APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        run: cat project.part00 project.part01 project.part02 project.part03 project.part04 | base64 -d > project.zip

      - name: Unpack project
        run: unzip -q project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: EyeControlAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        run: cp EyeControlAndroid/app/build/outputs/apk/debug/app-debug.apk EyeControl-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeControl-debug-apk
          path: EyeControl-debug.apk
          if-no-files-found: error
          retention-days: 30
