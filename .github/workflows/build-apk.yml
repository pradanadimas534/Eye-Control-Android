name: Build Eye Control APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        run: cat bin.part00 bin.part01 bin.part02 bin.part03 bin.part04 bin.part05 bin.part06 > project.zip

      - name: Verify and unpack project
        run: unzip -t project.zip && unzip -q project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        working-directory: EyeControlAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        run: cp EyeControlAndroid/app/build/outputs/apk/debug/app-debug.apk EyeControl-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeControl-debug-apk
          path: EyeControl-debug.apk
          if-no-files-found: error
          retention-days: 30
